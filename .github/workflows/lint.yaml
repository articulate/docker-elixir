name: Lint

on:
  pull_request:
  merge_group:

jobs:
  setup:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v3
      - name: Find Dockerfiles
        id: scan
        run: echo "dockerfiles=$(find . -name Dockerfile | cut -c3- | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"
    outputs:
      dockerfiles: ${{ steps.scan.outputs.dockerfiles }}
  lint:
    runs-on: ubuntu-slim
    needs: [setup]
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJSON(needs.setup.outputs.dockerfiles) }}
    steps:
      - uses: actions/checkout@v3
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # pin@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          ignore: DL3008
  lint-complete:
    if: always()
    runs-on: ubuntu-slim
    needs: [lint]
    steps:
      - name: Verify lint succeeded
        run: |
          [ "${{ needs.lint.result }}" = "success" ] || exit 1
